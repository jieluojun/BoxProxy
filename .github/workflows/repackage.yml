name: Repackage and sign

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download apktool 2.9.3
        run: |
          curl -fSL -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Rebuild APK with apktool
        run: |
          java -jar apktool.jar b apktool -o boxproxy-patched-unsigned.apk

      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KS_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No signing secrets found, generating a debug keystore"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KS_PASS=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          fi

      - name: zipalign
        run: |
          zipalign -p -f 4 boxproxy-patched-unsigned.apk boxproxy-patched-aligned.apk

      - name: Sign with apksigner
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEY_PASS}" \
            --out boxproxy-patched-signed.apk \
            boxproxy-patched-aligned.apk
          "$APKSIGNER" verify --verbose boxproxy-patched-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: boxproxy-patched-signed
          path: boxproxy-patched-signed.apk
          if-no-files-found: error

      - name: Upload signed APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: boxproxy-patched-signed.apk
