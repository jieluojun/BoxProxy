name: Validate full customized migration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'upstream/**'
      - 'scripts/**'
      - 'decompiled/**'
      - 'vpn-src/test/**'
      - '.github/workflows/validate-migration.yml'

permissions:
  contents: read

concurrency:
  group: upstream-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-migration:
    name: Full migration host checks and rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # What this workflow owns: the checks that nothing else runs - the snapshot
      # guard, the host-side compiler tests (new model, migrated helpers, wiring,
      # full smali assembly) and the shipped config-rewriter smali - plus the
      # rebuilds of the 171, 176 and 194 migrations.  The 214 hop is deliberately
      # not repeated here any more: `build-apk.yml` regenerates that candidate from
      # the same pinned inputs on every push and pull request that touches
      # `upstream/**` or `scripts/**`, runs the custom-hunk gate with its control
      # pass, its mutation self-test and the seven smali checkers inside
      # `scripts/migrate_214.py`, and nothing in this repo's migration scripts reads
      # `vpn-src/**` or `decompiled/**`, so no path that could change the 214 tree
      # is left uncovered by the split.
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check out pinned host dex translator
        uses: actions/checkout@v7
        with:
          repository: google/enjarify
          ref: f2db0563aa83885ce6e6acd5b7dc9a8a1a1e1987
          path: .tools/enjarify
          persist-credentials: false
      - name: Check out pinned JSON dependency for actual config rewriter tests
        uses: actions/checkout@v7
        with:
          repository: stleary/JSON-java
          ref: f9b5587c87aaf02e4a5ed1991d48d6c05993624a
          path: .tools/json-java
          persist-credentials: false
      - name: Install version-pinned host compiler and assembler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/ecj .tools/apktool
          npm pack @ctxo/lang-java-analyzer@0.13.0 apktool-jar@2.4.1 --pack-destination .tools --silent
          tar -xzf .tools/ctxo-lang-java-analyzer-0.13.0.tgz -C .tools/ecj
          tar -xzf .tools/apktool-jar-2.4.1.tgz -C .tools/apktool
      - name: Test snapshot safety
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s vpn-src/test -p 'test_upstream_snapshot.py' -v
      - name: Test actual new model, migrated helpers, wiring and full smali assembly
        env:
          ECJ_JAR: .tools/ecj/package/jar/ctxo-jdt-analyzer-17.jar
          APKTOOL_JAR: .tools/apktool/package/bin/apktool_2.4.1.jar
          ENJARIFY: .tools/enjarify
        shell: bash
        run: JAVA="$JAVA_HOME/bin/java" vpn-src/test/run-upstream-migration.sh
      - name: Test shipped core rewriter smali and the mihomo rule emitter
        env:
          ECJ_JAR: .tools/ecj/package/jar/ctxo-jdt-analyzer-17.jar
          APKTOOL_JAR: .tools/apktool/package/bin/apktool_2.4.1.jar
          ENJARIFY: .tools/enjarify
          JSON_JAVA: .tools/json-java
        shell: bash
        run: JAVA="$JAVA_HOME/bin/java" vpn-src/test/run-config-rewriters.sh
      - name: Download official, hash-pinned apktool 2.9.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o .tools/apktool_2.9.3.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          echo '7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4  .tools/apktool_2.9.3.jar' | sha256sum -c -
      # Repeat validation runs reuse the assembled candidates; the key hashes
      # every pinned input and script, so any change regenerates from scratch.
      - name: Cache pinned 171 migration candidate
        uses: actions/cache@v6
        with:
          path: .tools/ported-171
          key: ported-171-${{ hashFiles('upstream/26.11.16.25abc84/**', 'scripts/**') }}

      - name: Cache pinned 176 migration candidate
        uses: actions/cache@v6
        with:
          path: .tools/ported-176
          key: ported-176-${{ hashFiles('upstream/26.11.16.25abc84/**', 'upstream/26.11.17.73f2816/**', 'scripts/**') }}

      - name: Cache pinned 194 migration candidate
        uses: actions/cache@v6
        with:
          path: .tools/ported-194
          key: ported-194-${{ hashFiles('upstream/26.11.16.25abc84/**', 'upstream/26.11.19.bf82603/**', 'scripts/**') }}

      - name: Rebuild complete pinned 171 migration (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .tools/ported-171/decompiled/apktool.yml ]]; then
            echo ">> pinned 171 migration restored from cache"
          else
            python3 scripts/migrate_upstream.py \
              --snapshot upstream/26.11.16.25abc84 \
              --output .tools/ported-171
          fi
          version_name="$(sed -n 's/^  versionName:[[:space:]]*//p' .tools/ported-171/decompiled/apktool.yml | head -n 1 | tr -d '\r')"
          version_code="$(sed -n 's/^  versionCode:[[:space:]]*//p' .tools/ported-171/decompiled/apktool.yml | head -n 1 | tr -d '\r')"
          [[ "$version_code" == "171" && "$version_name" == "26.11.16.25abc84" ]]
          python3 scripts/check_smali_branch_offsets.py .tools/ported-171/decompiled
          python3 scripts/check_smali_reference_moves.py .tools/ported-171/decompiled
          java -jar .tools/apktool_2.9.3.jar b .tools/ported-171/decompiled \
            -p .tools/framework -o "$RUNNER_TEMP/full-migration-171-unsigned.apk"
          echo "Validated full 171 implementation ($version_name / $version_code). Physical Android/root/VPN and signature-compatible upgrade checks require devices and the original signing key."
      - name: Rebuild complete pinned 176 migration (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .tools/ported-176/decompiled/apktool.yml ]]; then
            echo ">> pinned 176 migration restored from cache"
          else
            python3 scripts/migrate_176.py --output .tools/ported-176
          fi
          version_name="$(sed -n 's/^  versionName:[[:space:]]*//p' .tools/ported-176/decompiled/apktool.yml | head -n 1 | tr -d '\r')"
          version_code="$(sed -n 's/^  versionCode:[[:space:]]*//p' .tools/ported-176/decompiled/apktool.yml | head -n 1 | tr -d '\r')"
          [[ "$version_code" == "176" && "$version_name" == "26.11.17.73f2816" ]]
          python3 scripts/check_smali_branch_offsets.py .tools/ported-176/decompiled
          python3 scripts/check_smali_reference_moves.py .tools/ported-176/decompiled
          python3 scripts/check_smali_labels.py .tools/ported-176/decompiled
          python3 scripts/check_smali_move_result.py .tools/ported-176/decompiled
          java -jar .tools/apktool_2.9.3.jar b .tools/ported-176/decompiled \
            -p .tools/framework -o "$RUNNER_TEMP/full-migration-176-unsigned.apk"
          echo "Validated full 176 implementation ($version_name / $version_code). Physical Android/root/VPN and signature-compatible upgrade checks require devices and the original signing key."
      - name: Rebuild complete pinned 194 migration (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .tools/ported-194/decompiled/apktool.yml ]]; then
            echo ">> pinned 194 migration restored from cache"
          else
            python3 scripts/migrate_194.py --output .tools/ported-194
          fi
          version_name="$(sed -n 's/^  versionName:[[:space:]]*//p' .tools/ported-194/decompiled/apktool.yml | head -n 1 | tr -d '\r')"
          version_code="$(sed -n 's/^  versionCode:[[:space:]]*//p' .tools/ported-194/decompiled/apktool.yml | head -n 1 | tr -d '\r')"
          [[ "$version_code" == "194" && "$version_name" == "26.11.19.bf82603" ]]
          python3 scripts/check_smali_branch_offsets.py .tools/ported-194/decompiled
          python3 scripts/check_smali_reference_moves.py .tools/ported-194/decompiled
          python3 scripts/check_smali_labels.py .tools/ported-194/decompiled
          python3 scripts/check_smali_move_result.py .tools/ported-194/decompiled
          java -jar .tools/apktool_2.9.3.jar b .tools/ported-194/decompiled \
            -p .tools/framework -o "$RUNNER_TEMP/full-migration-194-unsigned.apk"
          echo "Validated full 194 implementation ($version_name / $version_code). Physical Android/root/VPN and signature-compatible upgrade checks require devices and the original signing key."
