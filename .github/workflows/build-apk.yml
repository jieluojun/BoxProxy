name: Build APK

# Rebuild the 214 release with the reviewed customization ported onto it.
#
#   pinned 214 APK -> decompile -> regenerate the 194 trees -> port the reviewed
#   deltas -> run every smali check -> apktool b (dex only) -> repack over the
#   upstream entries -> zipalign -p 4 -> apksigner -> verify badging
#
# Only classes.dex ever differs from upstream: the port changes code and nothing
# else, so every resource is carried over from the pinned package byte for byte.
# apktool is used for one thing, turning smali into a dex, because the bundled
# version predates this app's resource table and has no aapt to rebuild it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "upstream/**"
      - "migration/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "upstream/**"
      - "migration/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # the snapshot the port targets, and the package it decompiles from
  UPSTREAM_VERSION: "26.11.23.aa98568"
  UPSTREAM_APK: "app/BoxProxy-26.11.23.aa98568-arm64-v8a.apk"
  PROJECT_DIR: ".tools/stage/draft"

jobs:
  build:
    name: Port, verify, align, sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The three decompiled trees are ~100 MB of smali that regenerates from
      # committed artifacts; caching them keeps a no-op rebuild down to minutes.
      - name: Cache decompiled trees
        uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ hashFiles('app/*.apk', 'upstream/**', 'scripts/setup_tools.sh', 'scripts/migrate_194.py') }}

      - name: Regenerate the working trees
        shell: bash
        run: |
          set -euo pipefail
          # this environment has a JDK and node already; the helper only installs
          # jdk4py when java is missing, which never happens on a runner
          bash scripts/setup_tools.sh all
          test -d .tools/base-214/decompiled/smali
          test -d .tools/up-194/decompiled
          test -d .tools/custom-194/decompiled

      - name: Port the reviewed deltas onto 214
        shell: bash
        run: |
          set -euo pipefail
          # --skip-maps on purpose: migration/214 holds the reviewed maps, and
          # regenerating them re-solves a question that is already settled
          python3 scripts/port_214.py --skip-maps
          test -d "$PROJECT_DIR/smali"

      - name: Read version from apktool.yml
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # the port copies the 214 tree, so its apktool.yml is the upstream one
          cp "$PROJECT_DIR/apktool.yml" /tmp/apktool.yml
          # apktool quotes the code, and the value is compared against aapt2's
          # badging output, which never quotes it
          version_name="$(sed -n 's/^  versionName:[[:space:]]*//p' /tmp/apktool.yml | head -n 1 | tr -d '\r' | tr -d "'\"")"
          version_code="$(sed -n 's/^  versionCode:[[:space:]]*//p' /tmp/apktool.yml | head -n 1 | tr -d '\r' | tr -d "'\"")"
          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "::error::failed to parse versionName/versionCode from apktool.yml"
            exit 1
          fi
          if [[ "$version_name" != "$UPSTREAM_VERSION" ]]; then
            echo "::error::refusing to build $version_name; this workflow targets $UPSTREAM_VERSION"
            exit 1
          fi
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "BoxProxy versionName=${version_name} versionCode=${version_code}"

      - name: Reject unusable smali
        shell: bash
        run: |
          set -euo pipefail
          # every check must pass: a tree that fails one of these assembles into
          # a dex the ART verifier rejects on device, which is worse than no build
          python3 scripts/check_smali_references.py     "$PROJECT_DIR"
          python3 scripts/check_smali_labels.py         "$PROJECT_DIR"
          python3 scripts/check_smali_move_result.py    "$PROJECT_DIR"
          python3 scripts/check_smali_branch_offsets.py "$PROJECT_DIR"
          python3 scripts/check_smali_reference_moves.py "$PROJECT_DIR"
          python3 scripts/check_smali_register_flow.py  "$PROJECT_DIR"
          # a spliced body can address slots its frame never declared; ART rejects
          # the whole class for it, and nothing else here models the frame size
          python3 scripts/check_smali_registers.py      "$PROJECT_DIR"
          # the 214 upstream itself carries four return-object bodies the ART
          # verifier accepts loosely; only what the port introduces is a failure
          python3 scripts/check_smali_return_types.py   "$PROJECT_DIR" \
            --baseline .tools/base-214/decompiled

      - name: Confirm every customization hook survived
        shell: bash
        run: |
          set -euo pipefail
          # the port is only correct if the reviewed call sites are still there;
          # a silent skip would otherwise ship a build with the feature disabled
          missing=0
          while read -r symbol want; do
            [[ -z "$symbol" ]] && continue
            got="$(grep -rl -- "$symbol" "$PROJECT_DIR/smali" | wc -l)"
            if [[ "$got" -ne "$want" ]]; then
              echo "::error::$symbol expected in $want files, found in $got"
              missing=1
            fi
          done <<'HOOKS'
          VpnPrefs;->processStart 1
          VpnPrefs;->items 1
          VpnRoot;->rootModes 1
          VpnBridge;->isVpnMode 5
          VpnBridge;->syncNow 1
          VpnBridge;->applyNow 1
          VpnAppProxy;->sel 1
          BoxctlFix;->wrap 1
          AppPerm;->check 1
          CfgNav;->wrap 1
          CoreConfigHistory;->onUpdate 1
          FToast;->init 1
          LdFix;->wrapProbe 2
          HOOKS
          exit "$missing"

      - name: Assemble classes.dex
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP must be set by the runner}"
          # apktool stops at the packaging step (no aapt for this resource table),
          # but it writes the dex first, and that is the only artifact needed
          set +e
          java -Xmx4g -jar .tools/bin/apktool.jar b "$PROJECT_DIR" -o "$RUNNER_TEMP/discard.apk" \
            2>&1 | tee "$RUNNER_TEMP/apktool.log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ ! -f "$PROJECT_DIR/build/apk/classes.dex" ]]; then
            echo "::error::apktool did not produce classes.dex (exit $status)"
            exit 1
          fi
          if ! grep -qi 'smaling' "$RUNNER_TEMP/apktool.log"; then
            echo "::error::apktool never reached the smali step"
            exit 1
          fi
          ls -lh "$PROJECT_DIR/build/apk/classes.dex"
          echo "::notice::apktool exited $status after writing the dex; packaging is done separately"

      - name: Repack over the upstream entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/assemble_apk.py \
            --project "$PROJECT_DIR" \
            --source "$UPSTREAM_APK" \
            --out "$RUNNER_TEMP/unsigned.apk"

      - name: Align, sign and verify
        id: sign
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          set -euo pipefail

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          bt="$(ls -d "$sdk"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -z "${bt}" || ! -x "${bt}apksigner" ]]; then
            echo "build-tools not found, installing via sdkmanager..."
            sdkmanager="$(find "$sdk/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
            yes | "$sdkmanager" --licenses > /dev/null || true
            "$sdkmanager" "build-tools;35.0.0"
            bt="$(ls -d "$sdk"/build-tools/*/ | sort -V | tail -n 1)"
          fi
          echo "Using build-tools: $bt"

          # ---- 签名材料 ----
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" ]]; then
            echo "::error::needs KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS secrets; refusing to ship a debug-signed build"
            exit 1
          fi
          ks="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          KS_PASS="$KEYSTORE_PASSWORD"
          KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          export KS_PASS KEY_PASS
          SIGN_MODE="release (repository secrets)"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          out="$GITHUB_WORKSPACE/artifacts/BoxProxy-${{ steps.ver.outputs.version_name }}-port.apk"

          "${bt}zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "${bt}zipalign" -c -p 4 "$RUNNER_TEMP/aligned.apk"
          # apksigner emits v1+v2+v3 in one pass and refuses to leave the file
          # unverifiable, which is the guarantee this build needs
          "${bt}apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --min-sdk-version 26 \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          "${bt}apksigner" verify --verbose --print-certs "$out" | tee "$RUNNER_TEMP/apksigner-verify.txt"

          badging="$("${bt}aapt2" dump badging "$out")"
          printf '%s\n' "$badging" | sed -n '1,5p'
          expected="package: name='com.boxproxy.box' versionCode='${EXPECTED_VERSION_CODE}' versionName='${EXPECTED_VERSION_NAME}'"
          if ! grep -Fq -- "$expected" <<<"$badging"; then
            echo "::error::APK badging mismatch; expected $expected"
            printf '%s\n' "$badging"
            exit 1
          fi

          ( cd "$GITHUB_WORKSPACE/artifacts" && sha256sum "$(basename "$out")" > "$(basename "$out").sha256" )
          echo "sign_mode=${SIGN_MODE}" >> "$GITHUB_OUTPUT"
          {
            echo "## BoxProxy APK build"
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 包名 | \`com.boxproxy.box\` |"
            echo "| 上游基线 | \`${UPSTREAM_VERSION}\` |"
            echo "| versionName / versionCode | ${{ steps.ver.outputs.version_name }} / ${{ steps.ver.outputs.version_code }} |"
            echo "| 签名模式 | ${SIGN_MODE} |"
            echo "| 产物 | \`$(basename "$out")\` ($(du -h "$out" | cut -f 1)) |"
            echo "| sha256 | \`$(sha256sum "$out" | cut -d ' ' -f 1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: BoxProxy-${{ steps.ver.outputs.version_name }}-port
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v8
        with:
          pattern: BoxProxy-*-port
          path: artifacts
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" artifacts/*.apk artifacts/*.sha256 \
            --repo "${{ github.repository }}" --verify-tag \
            --title "BoxProxy ${{ github.ref_name }}" \
            --notes "由 GitHub Actions 从上游 26.11.23.aa98568 回编译，并把已审阅的定制移植到该版本（apktool 汇编 classes.dex + zipalign + apksigner）。签名与官方版本不同，无法覆盖安装官方版本，请先卸载后再安装。"
