# Temporary scaffolding: decode the pinned official APK with apktool 2.9.3 on
# a runner (release assets are not reachable from the sandbox) and commit the
# apktool-source.tar.gz back to this branch. Removed before the migration PR.
name: Decode pinned snapshot (temporary)
on:
  workflow_dispatch:
  push:
    branches: [arena/5ab68c29-boxproxy]
    paths:
      - '.github/workflows/decode-snapshot.yml'
      - 'app/BoxProxy-26.11.21.5e4c0b7-arm64-v8a.apk'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Download apktool 2.9.3 (sha verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o apktool_2.9.3.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          echo '7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4  apktool_2.9.3.jar' | sha256sum -c -
      - name: Pin input APK
        run: |
          set -euo pipefail
          echo '2b07527282fded5454889d3716d9f497c67cd0714ea853445cd76298e4cdfbaf  app/BoxProxy-26.11.21.5e4c0b7-arm64-v8a.apk' | sha256sum -c -
      - name: Decode with apktool 2.9.3
        run: |
          set -euo pipefail
          rm -rf work
          java -jar apktool_2.9.3.jar d -f app/BoxProxy-26.11.21.5e4c0b7-arm64-v8a.apk -o work/decompiled
          mkdir -p upstream/26.11.21.5e4c0b7
          tar -czf upstream/26.11.21.5e4c0b7/apktool-source.tar.gz -C work decompiled
          echo '--- apktool.yml ---'
          sed -n '1,30p' work/decompiled/apktool.yml
          echo '--- counts ---'
          tar -tzf upstream/26.11.21.5e4c0b7/apktool-source.tar.gz | wc -l
      - name: Commit snapshot archive
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch upstream/26.11.21.5e4c0b7/apktool-source.tar.gz >/dev/null 2>&1; then
            echo 'snapshot archive already committed; nothing to do'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream/26.11.21.5e4c0b7/apktool-source.tar.gz
          git commit -m 'Pin decoded 26.11.21.5e4c0b7 upstream snapshot'
          git push
